<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- SHIFTY wordmark with shift key symbol -->
  <defs>
    <linearGradient id="swooshGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5B9BD5;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#5B9BD5;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Shift key symbol -->
  <path d="M12 8 L22 20 L18 20 L18 30 L6 30 L6 20 L2 20 Z"
        fill="#1E3A5F" transform="translate(0, 10)"/>

  <!-- SHIFTY text -->
  <text x="35" y="35"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="28"
        font-weight="700"
        fill="#1E3A5F"
        letter-spacing="-0.5">SHIFTY</text>

  <!-- Swoosh underline -->
  <path d="M35 45 Q90 52, 165 42"
        stroke="url(#swooshGradient)"
        stroke-width="3"
        fill="none"
        stroke-linecap="round"/>
</svg>
