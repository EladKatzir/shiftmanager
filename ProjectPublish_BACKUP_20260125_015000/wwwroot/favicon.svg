<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Circular background -->
  <circle cx="50" cy="50" r="48" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2"/>

  <!-- Calendar/Schedule icon -->
  <rect x="25" y="30" width="50" height="45" rx="4" fill="white"/>
  <rect x="25" y="30" width="50" height="12" rx="4" fill="#2E5C8A"/>

  <!-- Calendar grid -->
  <line x1="35" y1="50" x2="65" y2="50" stroke="#4A90E2" stroke-width="1"/>
  <line x1="35" y1="58" x2="65" y2="58" stroke="#4A90E2" stroke-width="1"/>
  <line x1="35" y1="66" x2="65" y2="66" stroke="#4A90E2" stroke-width="1"/>

  <line x1="42" y1="42" x2="42" y2="75" stroke="#4A90E2" stroke-width="1"/>
  <line x1="58" y1="42" x2="58" y2="75" stroke="#4A90E2" stroke-width="1"/>

  <!-- Highlight a shift -->
  <circle cx="50" cy="54" r="4" fill="#E74C3C"/>
</svg>
